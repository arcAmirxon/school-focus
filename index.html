<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>School Focus</title>
<style>
body{margin:0;font-family:Arial,sans-serif;background:#f1f5ff;color:#172554}
header{background:#142b5c;color:white;padding:22px 8%;font-size:24px;font-weight:bold}
main{max-width:650px;margin:40px auto;padding:20px}
.card{background:white;padding:28px;border-radius:16px;box-shadow:0 5px 24px #0001}
h1{font-size:32px}
p{line-height:1.6;color:#475569}
label{display:block;margin-top:16px;font-weight:bold}
input{width:100%;padding:12px;margin-top:7px;border:1px solid #cbd5e1;border-radius:8px;box-sizing:border-box}
button{margin-top:22px;width:100%;padding:14px;background:#2563eb;color:white;border:0;border-radius:8px;font-size:16px;cursor:pointer}
.note{font-size:13px}
</style>
</head>
<body>
<header>🎓 School Focus</header>
<main>
<div class="card">
<h1>Maktabni ro‘yxatdan o‘tkazish</h1>
<p>Maktabingizni platformaga ulash uchun ariza formasini to‘ldiring.</p>
<form id="schoolForm">
<label>Maktab nomi</label>
<input name="school" required placeholder="Masalan, 15-maktab">
<label>Maktab manzili</label>
<input name="address" required placeholder="Shahar, ko‘cha">
<label>Rasmiy elektron pochta</label>
<input name="email" type="email" required placeholder="school@example.com">
<button type="submit">Arizani yuborish</button>
</form>
<p class="note">Demo: ariza hozircha bazaga yuborilmaydi.</p>
</div>
</main>
<script>
const form = document.getElementById("schoolForm");

form.addEventListener("submit", async function (event) {
  event.preventDefault();

  const button = form.querySelector("button");
  button.disabled = true;
  button.textContent = "Yuborilmoqda...";

  const data = {
    school_name: form.elements.school.value.trim(),
    address: form.elements.address.value.trim(),
    contact_email: form.elements.email.value.trim()
  };

  try {
    const response = await fetch(
      "https://jnwogzamvmimmkbayvpv.supabase.co/functions/v1/school-registration",
      {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "apikey": "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Impud29nemFtdm1pbW1rYmF5dnB2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTIzMTI0NjQsImV4cCI6MjEwNzg4ODQ2NH0.Ro4w9ksH9jc6bADdeyJ-d31tRMPEMY-2rzljBjodoLc"
        },
        body: JSON.stringify(data)
      }
    );

    const result = await response.json();

    if (!response.ok) {
      throw new Error(result.error || "Arizani yuborib bo‘lmadi.");
    }

    alert("Arizangiz muvaffaqiyatli yuborildi!");
    form.reset();
  } catch (error) {
    alert("Xatolik: " + error.message);
  } finally {
    button.disabled = false;
    button.textContent = "Arizani yuborish";
  }
});
</script>
</body>
</html>
